[project]
name = "vector"
version = "0.1.0"
description = "Control the real Windows desktop with hand gestures from a webcam."
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.20",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pywin32>=306; sys_platform == 'win32'",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "Pillow>=10"]
learned = ["torch>=2.2"]

[project.scripts]
vector = "vector.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vector*"]
